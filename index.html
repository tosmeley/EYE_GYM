<head>
<meta charset="utf-8">

<title>Eye Gym: free eye exercises online</title>
<meta name="description" content="Free 2-minute eye exercises in your browser: follow, jump, side vision, near-far focus and rest. In English, Azerbaijani, Russian and Turkish.">

<style>
:root{
  --bg:#E9EFEA; --surface:#F5F8F5; --ink:#1D2B2A; --muted:#5B6C69;
  --accent:#2E7C76; --on-accent:#FFFFFF; --target:#D48A1F; --line:#C6D3CD; --good:#2E7C76; --bad:#B8503A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#142120; --surface:#1A2B29; --ink:#DCE7E3; --muted:#91A5A0;
    --accent:#62B8AF; --on-accent:#0F1A19; --target:#F0B24A; --line:#2D423F; --good:#62B8AF; --bad:#E0826C;
  }
}
:root[data-theme="dark"]{
  --bg:#142120; --surface:#1A2B29; --ink:#DCE7E3; --muted:#91A5A0;
  --accent:#62B8AF; --on-accent:#0F1A19; --target:#F0B24A; --line:#2D423F; --good:#62B8AF; --bad:#E0826C;
}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:1.0625rem;line-height:1.55;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
[hidden]{display:none !important}

.screen{display:none;height:100%;width:100%}
.screen.on{display:flex}

/* Home */
#home{flex-direction:column;align-items:center;overflow-y:auto;padding:1.25rem 1.25rem 3rem}
.wrap{width:100%;max-width:34rem}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.75rem}
.lang{display:flex;gap:.25rem}
.sound{background:none;border:1.5px solid var(--line);border-radius:8px;padding:.2rem .6rem;font-weight:700;font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:.35rem}
.sound svg,.hud-sound svg{width:1.05rem;height:1.05rem;flex:none}
.hud .hud-sound{display:grid;place-items:center;padding:.35rem .5rem}
.lang button{background:none;border:1.5px solid transparent;border-radius:8px;padding:.2rem .55rem;font-weight:700;font-size:.85rem;color:var(--muted)}
.lang button[aria-pressed="true"]{border-color:var(--accent);color:var(--ink)}
.chart{display:flex;flex-direction:column;align-items:center;font-weight:700;line-height:1;margin-bottom:1.75rem}
.chart span{letter-spacing:.3em;padding-left:.3em}
.bigE{background:none;border:0;padding:0 .1em;font-size:clamp(5rem,24vw,8.5rem);font-weight:700;line-height:1;
  transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.chart .r2{font-size:clamp(2.2rem,10vw,3.4rem);margin-top:.9rem}
.chart .r3{font-size:clamp(1.4rem,6vw,2rem);margin-top:.7rem;color:var(--muted)}
.lede{text-align:center;color:var(--muted);max-width:28rem;margin:0 auto 1.5rem}
.primary{display:block;width:100%;background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;
  padding:1rem 1.25rem;font-weight:700;font-size:1.1rem}
.primary:hover{filter:brightness(1.07)}
.ghost{background:none;border:1.5px solid var(--line);border-radius:12px;padding:.85rem 1.25rem;font-weight:700}
.ghost:hover{border-color:var(--accent)}
.install{display:block;width:100%;margin-top:.5rem}
.best{text-align:center;color:var(--muted);font-size:.95rem;margin-top:.75rem;min-height:1.5em}
.list{list-style:none;padding:0;margin:0;border-top:1.5px solid var(--line)}
.list li{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.75rem;padding:.9rem 0;border-bottom:1.5px solid var(--line)}
.list.numbered li{grid-template-columns:2rem 1fr auto}
.list .n{color:var(--muted);font-weight:700}
.list .t strong{display:block}
.list .t span{color:var(--muted);font-size:.95rem}
.list button{background:none;border:1.5px solid var(--line);border-radius:10px;padding:.4rem .9rem;font-weight:700;font-size:.95rem}
.list button:hover{border-color:var(--accent)}
#stepList{margin-top:2rem}
.sec{font-size:1.15rem;margin:2.25rem 0 .75rem}
.sec-sub{color:var(--muted);font-size:.95rem;margin:-.4rem 0 .9rem}
.badges{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:.5rem}
.badge{border:1.5px solid var(--line);border-radius:10px;padding:.6rem .75rem;opacity:.6}
.badge strong{display:block;font-size:.95rem}
.badge span{color:var(--muted);font-size:.82rem;line-height:1.35;display:block}
.badge.got{opacity:1;border-color:var(--accent);background:var(--surface)}
.badge.got strong{color:var(--accent)}
.note{color:var(--muted);font-size:.9rem;margin-top:1rem}
.note strong{color:var(--ink)}
.notes{margin-top:2.25rem}

/* History */
.history{margin-top:1.75rem;text-align:center}
.streak{font-weight:700;margin-bottom:.75rem}
.bars{display:flex;align-items:flex-end;justify-content:center;gap:6px;height:64px}
.bars span{width:18px;min-height:4px;background:var(--accent);border-radius:4px 4px 2px 2px;opacity:.85}
.bars span:last-child{opacity:1}
.bars-cap{color:var(--muted);font-size:.85rem;margin-top:.4rem}

/* Centered screens */
.center{flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.5rem;overflow-y:auto}
.center .wrap{max-width:30rem;margin:auto 0}
.kicker{color:var(--muted);font-size:.95rem;margin-bottom:.4rem;min-height:1.4em}
.center h2{font-size:clamp(2.2rem,8vw,3rem);line-height:1.1;margin-bottom:.35rem}
.trains{color:var(--accent);font-weight:700;margin-bottom:1.25rem}
.how{margin-bottom:2rem}
.btnrow{display:flex;flex-direction:column;gap:.75rem}
.score{font-size:clamp(4rem,20vw,6.5rem);font-weight:700;line-height:1;margin:.5rem 0 .75rem}
.detail{color:var(--muted);margin-bottom:2rem}
.progress{font-weight:700;color:var(--accent);margin:-1.25rem 0 1rem}
.progress:empty,.benefit:empty{display:none}
.benefit{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:.85rem 1rem;margin:0 0 1.75rem}
.scorenote{color:var(--muted);font-size:.85rem;margin:-1rem 0 1.75rem}
.sumlist{list-style:none;padding:0;margin:1rem 0 1.5rem;border-top:1.5px solid var(--line);text-align:left}
.sumlist li{display:flex;justify-content:space-between;padding:.7rem 0;border-bottom:1.5px solid var(--line)}
.sumlist li span:last-child{font-weight:700}

/* Share */
.share-status{min-height:1.4em;color:var(--muted);font-size:.9rem;margin-top:.75rem}
.share-fallback{width:100%;margin-top:.5rem;padding:.6rem;border:1.5px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem;resize:none}

/* Play */
#play{flex-direction:column}
.hud{display:flex;align-items:center;gap:1rem;padding:.75rem 1rem;border-bottom:1.5px solid var(--line)}
.hud .name{flex:1;min-width:0}
.hud .name strong{margin-right:.5rem}
.hud .name span{color:var(--muted);font-size:.9rem}
.hud .stat{color:var(--muted);font-size:.95rem;white-space:nowrap}
.hud .time{font-weight:700;min-width:2.5ch;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud button{background:none;border:1.5px solid var(--line);border-radius:10px;padding:.35rem .8rem;font-weight:700;font-size:.9rem}
.stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.dpad{position:absolute;left:50%;bottom:1rem;transform:translateX(-50%);display:none;
  grid-template-columns:repeat(3,3.25rem);grid-template-rows:repeat(3,3.25rem);gap:.25rem}
.dpad.on{display:grid}
.dpad button{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;display:grid;place-items:center}
.dpad button:hover{border-color:var(--accent)}
.dpad svg{width:1.3rem;height:1.3rem}
.dpad [data-dir="up"]{grid-area:1/2}
.dpad [data-dir="left"]{grid-area:2/1}
.dpad [data-dir="right"]{grid-area:2/3}
.dpad [data-dir="down"]{grid-area:3/2}
.dpad .hint{grid-area:2/2;display:grid;place-items:center;color:var(--muted);font-size:.72rem;text-align:center;line-height:1.1}

/* Reminder dialog and toast */
.overlay{position:fixed;inset:0;background:rgba(10,20,20,.5);display:none;align-items:center;justify-content:center;padding:1.25rem;z-index:10}
.overlay.on{display:flex}
.dialog{background:var(--bg);border-radius:16px;padding:1.75rem 1.5rem;max-width:22rem;width:100%;text-align:center}
.dialog h2{font-size:1.5rem;margin-bottom:.5rem}
.dialog p{color:var(--muted);margin-bottom:1.5rem}
.toast{position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:12px;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:11;max-width:calc(100% - 2rem);text-align:center}
.toast.show{opacity:1}

@media (prefers-reduced-motion: reduce){ .bigE,.toast{transition:none} }
@media (max-width:420px){ .hud .stat{display:none} }
</style>
</head>

      <button data-dir="down" aria-label="↓"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></button>
    </div>

</section>

<section id="result" class="screen center" aria-live="polite">
  <div class="wrap">
    <p class="kicker" id="resStep"></p>

</section>

<section id="summary" class="screen center" aria-live="polite">

      },
      draw(){
        const d = at(), r = R(), z = ZONE(), hit = pointer.active && dist(pointer.x,pointer.y,d.x,d.y) < r*z;
        trail.forEach((q,i) => { ctx.globalAlpha = i/trail.length*0.25; ctx.fillStyle = C.target; ctx.beginPath(); ctx.arc(q.x,q.y,r*0.35,0,7); ctx.fill(); });
        ctx.globalAlpha = 1; ctx.lineWidth = 3; ctx.strokeStyle = hit ? C.accent : C.line;
        ctx.beginPath(); ctx.arc(d.x,d.y,r*z,0,7); ctx.stroke();
        ctx.fillStyle = C.target; ctx.beginPath(); ctx.arc(d.x,d.y,r,0,7); ctx.fill();
        if (pointer.active){ ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(pointer.x,pointer.y,isTouch ? 30 : 6,0,7); ctx.stroke(); }
      },
      hud(){ return {stat: t0 > 0 ? t('followStat', {n: Math.round(on/t0*100)}) : '', time: Math.max(0, Math.ceil(dur - t0))}; },
      result(){ const s = Math.round(on/dur*100); return {score:s, metric:s, detail:t('followDetail', {n:s})}; }
    };
  }

  // Shared target logic for Jump, Endless Jump and the daily challenge
  function makeTargets(opts){
    const rng = opts.rng || Math.random;
    let t0 = 0, hits = 0, misses = 0, lives = 3, life = 1.4, gap = 0.4, side = 0, target = null;
    const rts = [], pops = [];
    const spawn = () => {
      side ^= 1; const r = R(), m = r*2.2;
      const lo = side ? Math.max(W*0.62, m) : m, hi = side ? W - m : Math.min(W*0.38, W - m);
      target = {x: lo + (hi-lo)*rng(), y: m + (H - 2*m)*rng(), age:0, life};
    };
    const avgMs = () => rts.length ? Math.round(rts.reduce((a,b)=>a+b,0)/rts.length*1000) : null;
    return {
      update(dt){
        t0 += dt;
        if (target){
          target.age += dt;
          if (target.age >= target.life){
            misses++; pops.push({x:target.x,y:target.y,a:1,miss:true}); target = null; gap = 0.3;
            if (opts.endless){ lives--; if (lives <= 0) this.done = true; }
          }
        } else { gap -= dt; if (gap <= 0 && (opts.endless || t0 < opts.dur)) spawn(); }
        pops.forEach(q => q.a -= dt*2.5); while (pops.length && pops[0].a <= 0) pops.shift();
        if (!opts.endless && t0 >= opts.dur) this.done = true;
      },
      onDown(x,y){
        if (!target) return;
        if (dist(x,y,target.x,target.y) <= R()*HIT()){
          hits++; rts.push(target.age); life = Math.max(opts.endless ? 0.45 : 0.6, life - (opts.endless ? 0.02 : 0.03));
          pops.push({x:target.x,y:target.y,a:1}); target = null; gap = 0.15;
        } else {
          misses++; pops.push({x:target.x,y:target.y,a:1,miss:true}); target = null; gap = 0.35;
          if (opts.endless){ lives--; if (lives <= 0) this.done = true; }
        }
      },
      draw(){
        const r = R();
        pops.forEach(q => { ctx.globalAlpha = Math.max(0,q.a); ctx.strokeStyle = q.miss ? C.bad : C.accent; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(q.x,q.y,r*(1 + (1-q.a)*1.2),0,7); ctx.stroke(); });
        ctx.globalAlpha = 1;
        if (target){
          ctx.fillStyle = C.target; ctx.beginPath(); ctx.arc(target.x,target.y,r,0,7); ctx.fill();
          ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(target.x,target.y,r*1.5,-Math.PI/2,-Math.PI/2 + (1 - target.age/target.life)*Math.PI*2); ctx.stroke();
        }
      },
      hud(){
        if (opts.endless) return {stat: t('endlessStat', {n:hits}), time: '♥'.repeat(Math.max(0,lives)) + '♡'.repeat(3 - Math.max(0,lives))};
        return {stat: t('jumpStat', {h:hits, m:misses}), time: Math.max(0, Math.ceil(opts.dur - t0))};
      },
      result(){
        const avg = avgMs(), react = avg ? t('avgReact', {ms:avg}) : '';
        if (opts.endless) return {score:hits, hits, metric:avg, detail: t('endlessDetail', {n:hits}) + react};
        const tot = hits + misses, s = tot ? Math.round(hits/tot*100) : 0;
        return {score:s, hits, metric:avg, detail: t('jumpDetail', {h:hits, m:misses}) + react};
      }
    };
  }

  const ANG = {right:0, down:Math.PI/2, left:Math.PI, up:-Math.PI/2};
  const ARROW = {right:'→', down:'↓', left:'←', up:'↑'};
  const DIRS = Object.keys(ANG);
  function drawE(x,y,s,ang,color,alpha){
    ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.globalAlpha = alpha; ctx.fillStyle = color;
    const u = s/5, h = s/2;
    ctx.fillRect(-h,-h,u,s); ctx.fillRect(-h,-h,s,u); ctx.fillRect(-h,-u/2,s,u); ctx.fillRect(-h,h-u,s,u);
    ctx.restore();
  }
  function makeEdge(){
    const rounds = 12; let round = 1, correct = 0, flash = 0.35, minFlash = 0.35, state = 'wait', timer = rand(0.7,1.3), e = null, fb = null;
    // Each direction appears 3 times, shuffled, never the same twice in a row
    let bag;
    do {
      bag = [...DIRS, ...DIRS, ...DIRS];
      for (let i = bag.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
    } while (bag.some((d,i) => i > 0 && d === bag[i-1]));
    const place = () => {
      const a = rand(0, Math.PI*2), s = Math.max(22, Math.min(W,H)*0.055), m = s + 24, f = rand(0.7, 0.95);
      e = {x: W/2 + Math.cos(a)*(W/2 - m)*f, y: H/2 + Math.sin(a)*(H/2 - m)*f, dir: bag[round-1], s};
      minFlash = Math.min(minFlash, flash);
    };
    return {
      update(dt){
        timer -= dt;
        if (state === 'wait' && timer <= 0){ place(); state = 'show'; timer = flash; }
        else if (state === 'show' && timer <= 0){ state = 'answer'; }
        else if (state === 'feedback' && timer <= 0){
          if (round >= rounds){ this.done = true; return; }
          round++; state = 'wait'; timer = rand(0.7,1.4); fb = null;
        }
      },
      answer(dir){
        if (state !== 'show' && state !== 'answer') return;
        const ok = dir === e.dir;
        if (ok){ correct++; flash = Math.max(0.1, flash - 0.03); } else flash = Math.min(0.6, flash + 0.05);
        fb = {ok}; state = 'feedback'; timer = 0.7;
      },
      draw(){
        const cx = W/2, cy = H/2, k = 12;
        ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(cx-k,cy); ctx.lineTo(cx+k,cy); ctx.moveTo(cx,cy-k); ctx.lineTo(cx,cy+k); ctx.stroke();
        if (state === 'show') drawE(e.x,e.y,e.s,ANG[e.dir],C.ink,1);
        if (state === 'answer') centerText(t('edgeAsk'), cx, cy + 40, 16, C.muted, W - 32);
        if (state === 'feedback' && fb){
          drawE(e.x,e.y,e.s,ANG[e.dir], fb.ok ? C.good : C.bad, 0.45);
          centerText(fb.ok ? t('edgeRight') : t('edgeWrong', {a: ARROW[e.dir]}), cx, cy + 40, 16, fb.ok ? C.good : C.bad, W - 32);
        }
      },
      hud(){ return {stat: t('edgeStat', {n:correct}), time: `${Math.min(round,rounds)}/${rounds}`}; },
      result(){
        const s = Math.round(correct/rounds*100), mf = Math.round(minFlash*1000);
        return {score:s, correct, metric: correct ? mf : null, detail: t('edgeDetail', {c:correct, r:rounds, ms:mf})};
      }
    };
  }

  function makeShift(){
    const hold = 4, switches = 6, dur = hold*switches; let t0 = 0, lastStep = -1;
    return {
      update(dt){
        t0 += dt; const step = Math.floor(t0 / hold);
        if (step !== lastStep && step < switches){ lastStep = step; tone(step % 2 === 0 ? 880 : 330); }
        if (t0 >= dur){ chime(); this.done = true; }
      },
      draw(){
        const cx = W/2, cy = H/2, base = Math.min(W,H)*0.22, step = Math.min(switches-1, Math.floor(t0/hold));
        const near = step % 2 === 0, k = (t0 % hold) / hold;
        ctx.strokeStyle = C.line; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx,cy,base*1.25,0,7); ctx.stroke();
        ctx.strokeStyle = C.accent; ctx.beginPath(); ctx.arc(cx,cy,base*1.25,-Math.PI/2,-Math.PI/2 + Math.PI*2*(1-k)); ctx.stroke();
        ctx.fillStyle = C.accent; ctx.globalAlpha = 0.14; ctx.beginPath(); ctx.arc(cx,cy, near ? base : base*0.35, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
        centerText(near ? t('near') : t('far'), cx, cy, Math.round(base*0.42), C.ink, base*2.2);
        centerText(near ? t('lookThumb') : t('lookFar'), cx, cy + base*1.25 + 34, 18, C.muted, W - 32);
      },
      hud(){ return {stat: t('shiftStat'), time: Math.max(0, Math.ceil(dur - t0))}; },
      result(){ return {score:null, offscreen:dur, detail: t('shiftDetail', {n:switches})}; }
    };
  }

  function makeRest(){
    const dur = 20; let t0 = 0, chimed = false, lastBlink = 0;
    return {
      update(dt){
        t0 += dt;
        const b = Math.floor(t0 / 4);                      // soft blink tone every 4 seconds
        if (b > lastBlink && t0 < dur - 1){ lastBlink = b; tone(392, 0, 0.6, 0.07); }
        if (t0 >= dur){ if (!chimed){ chime(); chimed = true; } this.done = true; }
      },
      draw(){
        const cx = W/2, cy = H/2, base = Math.min(W,H)*0.22, rr = base*(1 + 0.06*Math.sin(t0*Math.PI*2/5));
        ctx.fillStyle = C.accent; ctx.globalAlpha = 0.12; ctx.beginPath(); ctx.arc(cx,cy,rr,0,7); ctx.fill(); ctx.globalAlpha = 1;
        ctx.strokeStyle = C.line; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx,cy,base*1.25,0,7); ctx.stroke();
        ctx.strokeStyle = C.accent; ctx.beginPath(); ctx.arc(cx,cy,base*1.25,-Math.PI/2,-Math.PI/2 + Math.PI*2*(1 - Math.min(t0,dur)/dur)); ctx.stroke();
        centerText(String(Math.max(0, Math.ceil(dur - t0))), cx, cy, Math.round(base*0.55), C.ink);
        centerText(t('lookFar'), cx, cy + base*1.25 + 30, 18, C.ink, W - 32);
        centerText(t(soundOn ? 'blinkTone' : 'blinkNoSound'), cx, cy + base*1.25 + 56, 15, C.muted, W - 32);
      },
      hud(){ return {stat: t('restStat'), time: Math.max(0, Math.ceil(dur - t0))}; },
      result(){ return {score:null, offscreen:dur, detail: t('offDetail', {n:dur})}; }
    };
  }

  const MAKE = {
    follow: makeFollow, jump: () => makeTargets({dur:30}), edge: makeEdge, shift: makeShift, rest: makeRest,
    endless: () => makeTargets({endless:true}), daily: () => makeTargets({endless:true, rng: mulberry32(dailySeed())})
  };

  // ---------- loop ----------
  let ex = null, running = false, raf = 0, last = null, count = 0;
  function begin(id){
    current = id; show('play'); readColors(); resize();
    $('#hudName').textContent = exName(id); $('#hudStep').textContent = stepText(id);
    $('#dpad').classList.toggle('on', id === 'edge');
    ex = MAKE[id](); count = 3; last = null; running = true; pointer.active = false;
    cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
  }
  function stop(){ running = false; cancelAnimationFrame(raf); $('#dpad').classList.remove('on'); }
  function frame(now){
    if (!running) return;
    const dt = last == null ? 0 : Math.min(0.05, (now - last)/1000); last = now;
    ctx.clearRect(0,0,W,H);
    if (count > 0) count -= dt; else ex.update(dt);
    ex.draw();
    if (count > 0){
      ctx.globalAlpha = 0.85;
      centerText(String(Math.ceil(count)), W/2, H/2 - (current === 'edge' ? Math.min(W,H)*0.2 : 0), Math.round(Math.min(W,H)*0.22), C.muted);
      ctx.globalAlpha = 1;
    }
    const h = ex.hud(); $('#hudStat').textContent = count > 0 ? t('getReady') : h.stat; $('#hudTime').textContent = h.time;
    if (ex.done){ finish(); return; }
    raf = requestAnimationFrame(frame);
  }

  function finish(){
    stop();
    const r = ex.result(); results[current] = r;
    $('#resStep').textContent = stepText(current);
    $('#resName').textContent = exName(current);
    $('#resScore').textContent = r.score == null ? t('done') : r.score;
    $('#resDetail').textContent = r.detail;

    let prog = '';
    if (current === 'endless'){
      const b = getJSON(K.endless, 0);
      if (r.score > b){ setJSON(K.endless, r.score); prog = b ? t('newHigh') : ''; } else prog = t('yourBest', {p:b});
    } else if (current === 'daily'){
      const d = getJSON(K.daily, {}), cur = d.date === today() ? d.best : 0;
      if (r.score > cur){ setJSON(K.daily, {date: today(), best: r.score}); prog = cur ? t('newHigh') : t('dailyTodayBest', {b:r.score}); }
      else prog = t('dailyTodayBest', {b:cur});
    } else if (r.offscreen) prog = t('offToday', {n: addOffscreen(r.offscreen)});
    else prog = progressLine(current, r.metric);
    $('#resProgress').textContent = prog;
    $('#resBenefit').textContent = t((isJumpMode(current) ? 'jump' : current) + '_benefit');
    $('#resNote').hidden = r.score == null;

    lastShare = current === 'endless' ? t('shareEndless', {n:r.score})
      : current === 'daily' ? t('shareDaily', {n:r.score, d:dailyNumber()})
      : r.score == null ? t('shareBreak') : t('shareEx', {s:r.score, ex:exName(current)});
    $('#resShareStatus').textContent = '';
    const oldTa = $('#result .share-fallback'); if (oldTa) oldTa.remove();

    const inPlan = mode === 'workout' || mode === 'quick', lastStep = inPlan && !queue.length;
    if (mode === 'quick' && lastStep){ setJSON(K.breaks, getJSON(K.breaks, 0) + 1); track('quick-break'); }
    if (isJumpMode(current)) track(current + '-played');
    $('#resShare').hidden = inPlan;

    const p = $('#resPrimary'), s = $('#resSecondary'); s.hidden = false;
    if (inPlan && queue.length){ p.textContent = t('next', {name2: exName(queue[0])}); p.onclick = next; s.textContent = t('endWorkout'); s.onclick = goHome; }
    else if (mode === 'workout'){ p.textContent = t('seeResults'); p.onclick = next; s.textContent = t('endWorkout'); s.onclick = goHome; }
    else if (mode === 'quick'){ p.textContent = t('backMenu'); p.onclick = goHome; s.hidden = true; }
    else { p.textContent = t('playAgain'); p.onclick = () => begin(current); s.textContent = t('backMenu'); s.onclick = goHome; }
    show('result');
    awardBadges({id: current, r});
  }

  function showSummary(){
    const scored = ORDER.filter(id => results[id] && results[id].score != null);
    const total = scored.length ? Math.round(scored.reduce((a,id) => a + results[id].score, 0)/scored.length) : 0;
    const prev = getJSON(K.best, null), details = {};
    scored.forEach(id => details[id] = results[id].score);
    saveWorkout(total, details); track('workout-complete');
    const st = streakDays();
    $('#sumTotal').textContent = total;
    if (prev == null || total > prev){ setJSON(K.best, total); $('#sumBest').textContent = prev == null ? t('firstScore') : t('newBest', {p:prev}); }
    else $('#sumBest').textContent = t('yourBest', {p:prev});
    if (st > 1) $('#sumBest').textContent += t('daysRow', {n:st});
    const off = offscreenToday(); $('#sumOff').textContent = off ? t('offToday', {n:off}) : '';
    lastShare = t('shareWorkout', {s:total});
    $('#sumShareStatus').textContent = '';
    const oldTa = $('#summary .share-fallback'); if (oldTa) oldTa.remove();
    $('#sumList').innerHTML = ORDER.map(id => `<li><span>${esc(exName(id))}</span><span>${results[id] ? (results[id].score == null ? esc(t('done')) : results[id].score) : esc(t('skipped'))}</span></li>`).join('');
    show('summary');
    awardBadges({});
  }

  // ---------- Edge input ----------
  $('#dpad').addEventListener('click', e => { const b = e.target.closest('[data-dir]'); if (b && running && count <= 0 && ex.answer) ex.answer(b.dataset.dir); });
  document.addEventListener('keydown', e => {
    if (!running) return;
    if (e.key === 'Escape'){ stop(); goHome(); return; }
    const dir = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[e.key];
    if (dir && ex.answer && count <= 0){ e.preventDefault(); ex.answer(dir); }
  });

  // ---------- installable app ----------
  let deferredPrompt = null, swOK = false;
  const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function updateInstall(){
    const b = $('#installBtn'), h = $('#iosHint');
    b.textContent = t('installBtn'); h.textContent = t('iosHint');
    if (standalone()){ b.hidden = h.hidden = true; return; }
    b.hidden = !deferredPrompt;                       // Android and desktop Chrome/Edge
    h.hidden = !(isIOS() && swOK && !deferredPrompt); // iPhone and iPad: Safari has no install button, so show how
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; updateInstall(); });
  window.addEventListener('appinstalled', () => { deferredPrompt = null; updateInstall(); });
  $('#installBtn').onclick = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt(); try { const c = await deferredPrompt.userChoice; if (c && c.outcome === 'accepted') track('install'); } catch(e){}
    deferredPrompt = null; updateInstall();
  };
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    navigator.serviceWorker.register('sw.js').then(() => { swOK = true; updateInstall(); }).catch(() => {});
  }
  const _render = renderHome; renderHome = function(){ _render(); updateInstall(); renderSound(); };

  renderHome();
})();
</script>
</body>
